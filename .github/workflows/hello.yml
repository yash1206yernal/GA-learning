name: Day 6 Variables

on:
  workflow_dispatch:

env:
  APP_NAME: MyApplication

jobs:

  build:
    runs-on: ubuntu-latest

    env:
      ENVIRONMENT: development

    steps:
      - name: Print Global Variable
        run: echo $APP_NAME

      - name: Print Job Variable
        run: echo $ENVIRONMENT

      - name: Step Variable Demo
        env:
          STEP_VAR: StepLevel

        run: echo $STEP_VAR