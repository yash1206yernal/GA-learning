name: Composite Action Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run My Custom Action
        id: hello
        uses: ./.github/actions/hello-action
        with:
          username: Yash

      - name: Print Action Output
        run: echo "${{ steps.hello.outputs.greeting }}"