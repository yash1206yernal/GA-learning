
name: Day 11 Create Issue Demo

on:
  workflow_dispatch:

permissions:
  issues: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Create Issue
        run: |
          curl -X POST \
          -H "Authorization: Bearer $GITHUB_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          https://api.github.com/repos/${{ github.repository }}/issues \
          -d '{"title":"Test Issue from GitHub Actions","body":"Created automatically"}'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
