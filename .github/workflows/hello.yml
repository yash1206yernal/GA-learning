name: Conditional Demo

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run Tests?"
        required: true
        type: boolean

jobs:
  demo:     
    runs-on: ubuntu-latest

    steps:
      - name: Run Tests
        if: ${{ inputs.run_tests }}
        run: echo "Running Tests..."

      - name: Deploy
        run: echo "Deploying Application..."