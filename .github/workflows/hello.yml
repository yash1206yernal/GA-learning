name: Permissions Demo

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Show Permissions Demo
        run: |
          echo "Repository: ${{ github.repository }}"
          echo "Actor: ${{ github.actor }}"
          echo "This workflow has:"
          echo "- Read access to repository contents"
          echo "- Write access to issues"