name: Expression Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Main Branch Check
        if: github.ref == 'refs/heads/main'
        run: echo "Running on main"

      - name: Starts With
        if: startsWith(github.ref, 'refs/heads/')
        run: echo "This is a branch"

      - name: Ends With
        if: endsWith(github.ref, 'main')
        run: echo "Branch ends with main"

      - name: Contains
        if: contains(github.ref, 'main')
        run: echo "Branch contains main"

      - name: Combined Condition
        if: github.ref == 'refs/heads/main' && contains(github.ref, 'main')
        run: echo "Production deployment condition satisfied"