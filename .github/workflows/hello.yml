name: Day 9 Include Exclude

on:
  workflow_dispatch:

jobs:
  test:

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:

        os:
          - ubuntu-latest
          - windows-latest

        node-version:
          - 18
          - 20

        exclude:
          - os: windows-latest
            node-version: 18

        include:
          - os: ubuntu-latest
            node-version: 22

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Show Matrix Values
        run: |
          echo "OS=${{ matrix.os }}"
          echo "Node=${{ matrix.node-version }}"