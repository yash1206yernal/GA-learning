name: Job Dependencies Demo

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build
        run: |
          echo "Building application..."
          sleep 2
          echo "Build completed!"

  test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Test
        run: |
          echo "Testing application..."
          sleep 2
          echo "Tests passed!"

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Deploy
        run: |
          echo "Deploying application..."
          echo "Deployment completed!"