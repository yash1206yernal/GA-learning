name: Run Container

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t demo-app:v1 .

      - name: Run Container
        run: docker run -d --name myapp demo-app:v1

      - name: Show Containers
        run: docker ps

      - name: Container Logs
        run: docker logs myapp

      - name: Execute Command
        run: docker exec myapp ls -la

      - name: Stop Container
        run: docker stop myapp

      - name: Remove Container
        run: docker rm myapp  