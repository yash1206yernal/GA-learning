name: Day 5 CI Pipeline

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Build Step
        run: echo "Building application..."

      - name: Sleep Build
        run: sleep 5

  test:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - name: Test Step
        run: echo "Running tests..."

      - name: Sleep Test
        run: sleep 5

  deploy:
    needs: test

    runs-on: ubuntu-latest

    steps:
      - name: Deploy Step
        run: echo "Deploying application..."

      - name: Show Current User
        run: whoami