      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [18,22]

        exclude:
          - os: windows-latest
            node: 22

    runs-on: ${{ matrix.os }}

    steps:
      - run: |
          echo "OS=${{ matrix.os }}"
          echo "Node=${{ matrix.node }}"