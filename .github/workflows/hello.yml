name: Docker Push Demo

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/demo-app:v1 .
          docker tag ${{ secrets.DOCKER_USERNAME }}/demo-app:v1 \
                     ${{ secrets.DOCKER_USERNAME }}/demo-app:latest

      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

      - name: Push Version Tag
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-app:v1

      - name: Push Latest Tag
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/demo-app:latest