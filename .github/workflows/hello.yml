name: Day 10 Cache Demo

on:
  workflow_dispatch:

jobs:

  cache-demo:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-cache-${{ runner.os }}

      - name: Install Dependencies
        run: npm install

      - name: Run Test
        run: npm run test