name: App + Postgres Demo

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    container:
      image: node:20

    services:
      postgres:
        image: postgres

        env:
          POSTGRES_PASSWORD: mypassword
          POSTGRES_DB: mydb

        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - run: |
          echo "Node Version"
          node --version

      - run: |
          echo "Postgres Service Running"