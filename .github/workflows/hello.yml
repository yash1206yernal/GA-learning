name: OS Matrix Demo

on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Show OS
        run: |
          echo "Running on: ${{ matrix.os }}"
          echo "Operating System:"
          uname -a