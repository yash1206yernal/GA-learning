name: Day 7 Setup Action

on:
  workflow_dispatch:

jobs:

  node-demo:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

        with:
          node-version: 20

      - name: Verify Node Version
        run: node -v

      - name: Verify NPM Version
        run: npm -v