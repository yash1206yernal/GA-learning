name: Run Container

on:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Image
        run: docker build -t demo-app:v1 .

      - name: Run Container
        run: docker run -d --name myapp demo-app:v1

      - name: Show Containers
        run: docker ps