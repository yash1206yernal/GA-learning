name: Composite Action Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Greeting Action
        id: greet
        uses: ./.github/actions/hello-action
        with:
          username: Yash
          company: OpenAI

      - name: Display Output
        run: |
          echo "Returned message:"
          echo "${{ steps.greet.outputs.greeting }}"