name: Docker Login Demo

on:
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest

    steps:
      - name: Login to Docker Hub
        run: |
          echo "${{ secrets.DOCKER_TOKEN }}" | docker login \
            -u "${{ secrets.DOCKER_USERNAME }}" \
            --password-stdin

            - name: Build Image
              run: docker build -t ${{ secrets.DOCKER_USERNAME }}/demo-app:v1 .

            - name: Push Image
              run: docker push ${{ secrets.DOCKER_USERNAME }}/demo-app:v1