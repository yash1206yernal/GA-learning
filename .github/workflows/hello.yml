name: Fail Fast Demo

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        version: [1,2,3]

    steps:
      - name: Print Version
        run: echo "Version=${{ matrix.version }}"

      - name: Fail Version 2
        if: ${{ matrix.version == 2 }}
        run: exit 1