name: If Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Always Runs
        run: echo "Step 1"

      - name: Conditional Step
        if: true
        run: echo "This ran because condition is true"

      - name: Never Runs
        if: false
        run: echo "You should never see this"