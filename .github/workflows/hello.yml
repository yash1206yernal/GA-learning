name: Status Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Step 1
        run: echo "Hello"

      - name: Force Failure
        run: exit 1

      - name: Runs on Success
        if: success()
        run: echo "Success"

      - name: Runs on Failure
        if: failure()
        run: echo "Failure detected"

      - name: Always Runs
        if: always()
        run: echo "Cleanup completed"