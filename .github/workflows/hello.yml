name: Reusable Workflow

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string

    secrets:
      my_secret:
        required: true

    outputs:
      message:
        description: "Greeting message"
        value: ${{ jobs.hello.outputs.message }}

jobs:
  hello:
    runs-on: ubuntu-latest

    outputs:
      message: ${{ steps.greeting.outputs.message }}

    steps:
      - name: Greeting
        id: greeting
        run: |
          MESSAGE="Hello ${{ inputs.username }}!"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
          echo "$MESSAGE"