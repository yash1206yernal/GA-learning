name: Day 5 Workflows

on:
  workflow_dispatch:

jobs:

  job1:
    runs-on: ubuntu-latest

    steps:
      - name: Break Job 1
        run: echo "This is Job 1"

      - name: Sleep for 10 seconds
        run: sleep 10

  job2:
    needs: job1

    runs-on: ubuntu-latest

    steps:
      - name: Job 2 Message
        run: echo "This is Job 2"

      - name: Show Current User
        run: whoami