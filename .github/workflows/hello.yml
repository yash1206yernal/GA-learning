name: Multiple Dependencies

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build completed"

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Tests completed"

  security:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Security scan completed"

  deploy:
    needs: [test, security]
    runs-on: ubuntu-latest
    steps:
      - run: echo "Deployment completed"