name: Upload Artifact Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Create Report
        run: |
          echo "GitHub Actions Report" > report.txt
          echo "Created on $(date)" >> report.txt

      - name: Display Report
        run: cat report.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-report
          path: report.txt