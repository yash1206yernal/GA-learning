name: Matrix Fail Fast Demo

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [1, 2, 3]

    steps:
      - name: Show Version
        run: |
          echo "Running version ${{ matrix.version }}"

      - name: Test
        run: |
          if [ "${{ matrix.version }}" = "2" ]; then
            echo "Version 2 failed!"
            exit 1
          fi

          echo "Version ${{ matrix.version }} passed!"