name: Multiple Artifacts Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - run: echo "Application" > app.txt
      - run: echo "Log File" > log.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app-artifact
          path: app.txt

      - uses: actions/upload-artifact@v4
        with:
          name: log-artifact
          path: log.txt