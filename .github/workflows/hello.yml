name: Reusable Workflow

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string

    secrets:
      my_secret:
        required: true

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Greeting
        run: |
          echo "Hello ${{ inputs.username }}!"
          echo "Secret is: ${{ secrets.my_secret }}"