name: Status Functions Demo

on:
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest

    steps:
      - name: Simulate Failure
        run: exit 1

      - name: Success Step
        if: ${{ success() }}
        run: echo "Everything Passed"

      - name: Failure Step
        if: ${{ failure() }}
        run: echo "Something Failed"

      - name: Always Step
        if: ${{ always() }}
        run: echo "Cleanup Running"