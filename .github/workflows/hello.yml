name: Artifact Sharing Demo

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create File
        run: echo "Hello From Build Job" > app.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-file
          path: app.txt

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: app-file

      - name: Read File
        run: cat app.txt