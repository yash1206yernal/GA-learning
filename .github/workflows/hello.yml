name: Day 8 Multi Job Artifacts

on:
  workflow_dispatch:

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Build File
        run: |
          mkdir build
          echo "Artifact transferred successfully" > build/output.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: build/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Show Downloaded Files
        run: ls -R

      - name: Read Artifact Content
        run: cat output.txt