name: My First Workflow

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print Message
        run: echo "Learning YAML"

      - name: Show Files
        run: ls -la

      - name: Show Current Directory
        run: pwd

      - name: Show Date and Time
        run: date
        
      - name: Print Current User
        run: whoami

      - name: Ping Google
        run: ping google.com
