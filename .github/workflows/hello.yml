name: Build And Deploy

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Package
        run: |
          mkdir package
          echo "Application Version 1.0" > package/app.txt

      - name: Upload Package
        uses: actions/upload-artifact@v4
        with:
          name: deployment-package
          path: package/

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download Package
        uses: actions/download-artifact@v4
        with:
          name: deployment-package

      - name: Verify Package
        run: |
          ls -R
          cat app.txt