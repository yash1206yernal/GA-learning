name: Greeting Action

description: Reusable greeting action

inputs:
  username:
    description: User's name
    required: true

  company:
    description: Company name
    required: true

outputs:
  greeting:
    description: Greeting message
    value: ${{ steps.greet.outputs.message }}

runs:
  using: composite

  steps:
    - id: greet
      shell: bash
      run: |
        MESSAGE="Hello ${{ inputs.username }}, welcome to ${{ inputs.company }}!"
        echo "$MESSAGE"
        echo "message=$MESSAGE" >> $GITHUB_OUTPUT

    - shell: bash
      run: date